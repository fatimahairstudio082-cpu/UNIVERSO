<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Fátima Caldea · Colorimetría. Piezas reutilizables para el curso premium (portadas de módulo, redes). Fotos de referencias/curso. -->
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #16223A; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; font-family: ui-serif, Georgia, serif; }
      .escena { position: absolute; inset: 0; overflow: hidden; }
      .fondo { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(.45); }
      .velo { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(22,34,58,.92), rgba(22,34,58,.55)); }
      .marco { position: absolute; border: 3px solid #B08D57; border-radius: 18px; overflow: hidden; background: #0f1828; box-shadow: 0 30px 80px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
      .marco img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .texto { position: absolute; color: #fff; }
      .kicker { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 26px; letter-spacing: .22em; text-transform: uppercase; color: #D9C29A; font-weight: 700; }
      .linea { width: 140px; height: 4px; background: #B08D57; margin: 26px 0; transform-origin: left center; }
      .titulo { font-weight: 600; line-height: 1.05; color: #fff; }
      .autora { margin-top: 30px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 26px; color: #D9C29A; letter-spacing: .06em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <section id="s0" class="clip escena" data-start="0" data-duration="5" data-track-index="0">
        <div class="fondo" id="s0-fondo" data-layout-allow-overflow style="background-image:url('assets/tinte_correccion.jpg')"></div>
        <div class="velo"></div>
        <div class="marco" id="s0-marco" style="right:90px;top:120px;width:1060px;height:840px"><img id="s0-img" src="assets/tinte_correccion.jpg" alt="Retoque de raíz" /></div>
        <div class="texto" style="left:110px;top:330px;width:640px">
          <div class="kicker" id="s0-k">Colorimetría</div>
          <div class="linea" id="s0-l"></div>
          <h1 class="titulo" id="s0-t" style="font-size:84px">Retoque de raíz</h1>
          <div class="autora" id="s0-a">Fátima Caldea</div>
        </div>
      </section>
      <section id="s1" class="clip escena" data-start="5" data-duration="5" data-track-index="0">
        <div class="fondo" id="s1-fondo" data-layout-allow-overflow style="background-image:url('assets/mechas_aluminio.jpg')"></div>
        <div class="velo"></div>
        <div class="marco" id="s1-marco" style="right:90px;top:120px;width:1060px;height:840px"><img id="s1-img" src="assets/mechas_aluminio.jpg" alt="Mechas con papel de aluminio" /></div>
        <div class="texto" style="left:110px;top:330px;width:640px">
          <div class="kicker" id="s1-k">Colorimetría</div>
          <div class="linea" id="s1-l"></div>
          <h1 class="titulo" id="s1-t" style="font-size:84px">Mechas con papel de aluminio</h1>
          <div class="autora" id="s1-a">Fátima Caldea</div>
        </div>
      </section>
      <section id="s2" class="clip escena" data-start="10" data-duration="5" data-track-index="0">
        <div class="fondo" id="s2-fondo" data-layout-allow-overflow style="background-image:url('assets/balayage_90.jpg')"></div>
        <div class="velo"></div>
        <div class="marco" id="s2-marco" style="right:90px;top:120px;width:1060px;height:840px"><img id="s2-img" src="assets/balayage_90.jpg" alt="Balayage" /></div>
        <div class="texto" style="left:110px;top:330px;width:640px">
          <div class="kicker" id="s2-k">Colorimetría</div>
          <div class="linea" id="s2-l"></div>
          <h1 class="titulo" id="s2-t" style="font-size:84px">Balayage</h1>
          <div class="autora" id="s2-a">Fátima Caldea</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s0-fondo", { scale: 1.15 }, { scale: 1.25, duration: 5, ease: "none" }, 0);
      tl.fromTo("#s0-marco", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0+0.1);
      tl.fromTo("#s0-k", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0+0.4);
      tl.fromTo("#s0-l", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0+0.6);
      tl.fromTo("#s0-t", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0+0.8);
      tl.fromTo("#s0-a", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0+1.3);
      tl.to("#s0-marco", { opacity: 0, duration: 0.4 }, 0+5-0.45);
      tl.fromTo("#s1-fondo", { scale: 1.15 }, { scale: 1.25, duration: 5, ease: "none" }, 5);
      tl.fromTo("#s1-marco", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 5+0.1);
      tl.fromTo("#s1-k", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 5+0.4);
      tl.fromTo("#s1-l", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 5+0.6);
      tl.fromTo("#s1-t", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 5+0.8);
      tl.fromTo("#s1-a", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 5+1.3);
      tl.to("#s1-marco", { opacity: 0, duration: 0.4 }, 5+5-0.45);
      tl.fromTo("#s2-fondo", { scale: 1.15 }, { scale: 1.25, duration: 5, ease: "none" }, 10);
      tl.fromTo("#s2-marco", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 10+0.1);
      tl.fromTo("#s2-k", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 10+0.4);
      tl.fromTo("#s2-l", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 10+0.6);
      tl.fromTo("#s2-t", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 10+0.8);
      tl.fromTo("#s2-a", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 10+1.3);
      tl.to("#s2-marco", { opacity: 0, duration: 0.4 }, 10+5-0.45);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
